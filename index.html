<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>TodoList</title>
  </head>
  <body>
    <div class="todo-container">
      <h1>ToDo List</h1>
      <form id="todo-form">
        <input
          type="text"
          id="todo-input"
          placeholder="Add new task"
          required
          aria-label="Add new task"
        />
        <button type="submit">Submit</button>
      </form>
      <div class="filter-buttons">
        <button id="all-tasks" class="filter-btn" data-filter="all">
          All Tasks
        </button>
        <button id="completed-tasks" class="filter-btn" data-filter="completed">
          Completed Tasks
        </button>
        <button
          id="incompleted-tasks"
          class="filter-btn"
          data-filter="incompleted"
        >
          Incompleted Tasks
        </button>
      </div>
      <ul id="todo-list"></ul>
    </div>
    <script src="/main.js"></script>
  </body>
</html>
